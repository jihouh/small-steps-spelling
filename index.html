<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Steps Spelling</title>
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <style>
        /* Inline critical styles */
        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }
        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; 
            display: flex; justify-content: space-around; 
            background: white; padding: 15px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
        }
        .nav-item { 
            background: none; border: none; 
            font-family: 'Klee One', cursive;
            cursor: pointer; padding: 10px;
        }
        .nav-item.active { color: #FF6B6B; }
    </style>
</head>
<body>
    <div class="header" style="padding: 15px; text-align: center;">
        <h1 style="color: #FF6B6B; margin: 0;">Small Steps Spelling ✨</h1>
    </div>

    <!-- Screens -->
    <div id="home" class="screen active"></div>
    <div id="learn" class="screen"></div>
    <div id="spell" class="screen"></div>
    <div id="match" class="screen"></div>
    <div id="challenge" class="screen"></div>
    <div id="library" class="screen"></div>
    <div id="admin" class="screen"></div>

    <!-- Navigation -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="showScreen('home')">🏠 Home</button>
        <button class="nav-item" onclick="showScreen('learn')">📖 Learn</button>
        <button class="nav-item" onclick="showScreen('spell')">✏️ Spell</button>
        <button class="nav-item" onclick="showScreen('match')">🧩 Match</button>
        <button class="nav-item" onclick="showScreen('challenge')">🔥 Chall.</button>
        <button class="nav-item" onclick="showScreen('library')">📚 Lib</button>
    </nav>

    <!-- Load as regular script, not module -->
    <script src="./js/app.js"></script>
</body>
</html>
