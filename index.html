<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Steps Spelling</title>
    <link rel="stylesheet" href="./css/variables.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #F7FFF7;
            min-height: 100vh;
            width: 100%;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Header */
        .header {
            width: 100%;
            text-align: center;
            padding: 15px 20px;
            background: #F7FFF7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
        }
        
        .header h1 {
            color: #FF6B6B;
            font-size: 24px;
            margin: 0;
            flex: 1;
        }
        
        .header-icons {
            display: flex;
            gap: 10px;
        }
        
        .icon-btn {
            background: #eee;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Password Modal */
        .password-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .password-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 300px;
            width: 90%;
        }
        
        .password-card h3 {
            margin-bottom: 15px;
            color: #555;
        }
